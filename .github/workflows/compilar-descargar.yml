name: Aparcar - Validacion manual sin artefactos

# Sin ejecuciones por push y sin publicar ZIP/MSIX.
# Se habilitará publicación solamente para un hito importante.
on:
  push:
    branches: ["feature/base-winui-sqlite-v0.1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aparcar-validacion-manual
  cancel-in-progress: true

jobs:
  validar-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar y ejecutar pruebas
        shell: pwsh
        run: ./scripts/Preparar-Aparcar.ps1
